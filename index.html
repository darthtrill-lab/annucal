<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Annucal — Family Planner</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#fff;--bg2:#f7f7f5;--bg3:#f1efea;--border:#e5e3dc;--border2:#d0cdc4;
  --text:#1a1a18;--text2:#6b6964;--text3:#9e9b95;
  --blue:#378ADD;--blue-bg:#E6F1FB;--blue-txt:#0C447C;--blue-brd:#185FA5;
  --hdr-dark:#4A515E;--hdr-dark-txt:rgba(255,255,255,.92);--hdr-light:#F0F2F5;
  --teal:#1D9E75;--teal-bg:#E1F5EE;--teal-txt:#085041;--teal-brd:#0F6E56;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);font-size:13px;}
/* TOPBAR */
.topbar{background:var(--bg);border-bottom:0.5px solid var(--border);padding:0 12px;position:sticky;top:0;z-index:10;}
.tb1{display:flex;align-items:center;gap:8px;padding:8px 0;flex-wrap:wrap;}
.logo{font-size:16px;font-weight:500;letter-spacing:-.4px;color:var(--text);}
.logo em{color:var(--blue);font-style:normal;}
.yn{background:none;border:0.5px solid var(--border2);border-radius:5px;width:24px;height:24px;cursor:pointer;font-size:14px;color:var(--text);display:flex;align-items:center;justify-content:center;}
.yn:hover{background:var(--bg2);}
.yrlbl{font-size:14px;font-weight:500;min-width:40px;text-align:center;}
.tog{display:flex;border:0.5px solid var(--border2);border-radius:6px;overflow:hidden;}
.tb{padding:4px 11px;font-size:11px;background:none;border:none;cursor:pointer;color:var(--text2);}
.tb.on{background:var(--blue);color:#fff;font-weight:500;}
.ab{padding:5px 11px;font-size:11px;background:none;border:0.5px solid var(--border2);border-radius:6px;cursor:pointer;color:var(--text2);}
.ab:hover{background:var(--bg2);}
.abp{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:500;}
.abp:hover{background:var(--blue-brd);}
.ml{margin-left:auto;}
.vsep{width:1px;height:18px;background:var(--border);flex-shrink:0;}
/* sync badge */
.sync-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text3);padding:4px 8px;border-radius:20px;border:0.5px solid var(--border);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0;}
.sync-dot.ok{background:#639922;}
.sync-dot.saving{background:#BA7517;animation:pulse 1s infinite;}
.sync-dot.err{background:#E24B4A;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
/* LANE BAR */
.lanebar{display:flex;align-items:center;gap:5px;padding:5px 0;border-top:0.5px solid var(--border);overflow-x:auto;min-height:36px;scrollbar-width:none;}
.lanebar::-webkit-scrollbar{display:none;}
.lpill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:500;border:1.5px solid transparent;user-select:none;white-space:nowrap;transition:opacity .15s;}
.lpill.off{opacity:.25;}
.lpill-sq{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:500;border:1.5px solid transparent;user-select:none;white-space:nowrap;transition:opacity .15s;}
.lpill-sq.off{opacity:.25;}
.ldot{width:8px;height:8px;border-radius:50%;}
.lsep{width:1px;height:20px;background:var(--border);flex-shrink:0;margin:0 3px;}
.ladd{width:24px;height:24px;border-radius:50%;border:0.5px solid var(--border2);background:none;cursor:pointer;font-size:16px;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ladd:hover{background:var(--bg2);}
/* BODY */
.body{display:flex;height:calc(100vh - 90px);overflow:hidden;}
.calwrap{flex:1;overflow:auto;min-width:0;}
.sb{width:200px;flex-shrink:0;background:var(--bg);border-left:0.5px solid var(--border);overflow-y:auto;padding:12px;}
.sb-h{font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:7px;margin-top:12px;}
.sb-h:first-child{margin-top:0;}
/* CALENDAR TABLE */
table.ct{border-collapse:collapse;table-layout:fixed;background:var(--bg);}
table.ct th,table.ct td{border:0.5px solid var(--border);padding:0;vertical-align:middle;}
.th-lbl{width:92px;min-width:92px;background:var(--bg2);border-right:1.5px solid var(--border2)!important;position:sticky;left:0;z-index:4;}
.th-mon{background:var(--hdr-dark);text-align:left;padding:3px 6px;font-size:10px;font-weight:500;color:var(--hdr-dark-txt);text-transform:uppercase;letter-spacing:.4px;border-right:1.5px solid var(--border2)!important;}
.th-day{width:26px;min-width:26px;max-width:26px;background:var(--hdr-light);text-align:center;padding:2px 0 3px;}
.th-day.wk{background:rgba(153,60,29,.06);}
.th-day.th-tod{background:rgba(55,138,221,.18);}
.dn{font-size:10px;font-weight:500;color:var(--text);display:block;}
.dn.todn{background:var(--blue);color:#fff;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:9px;}
.dw{font-size:8px;color:var(--text3);display:block;margin-top:1px;}
.td-lbl{width:92px;min-width:92px;background:var(--bg2);border-right:1.5px solid var(--border2)!important;padding:0 6px;position:sticky;left:0;z-index:2;}
.td-d{width:26px;min-width:26px;max-width:26px;height:27px;cursor:pointer;position:relative;}
.td-d:hover{background:var(--bg2);}
.td-d.wk{background:rgba(153,60,29,.04);}
.td-d.tod{background:rgba(55,138,221,.1);}
.td-d.mo-end{border-right:1.5px solid var(--border2)!important;}
.td-d.ph-tint{background:rgba(29,158,117,.04);}
.eb{position:absolute;top:3px;bottom:3px;left:0;right:0;display:flex;align-items:center;overflow:hidden;}
.eb-in{position:absolute;inset:0;display:flex;align-items:center;padding:0 3px;overflow:hidden;}
.eblbl{font-size:8px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ms-dia{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(45deg);width:10px;height:10px;cursor:pointer;z-index:3;}
.lane-sep{border-top:2px solid var(--border2)!important;}
/* VERTICAL CALENDAR */
.vert-wrap{flex:1;overflow:auto;padding:8px;background:var(--bg);}
.vert-grid{display:grid;grid-template-columns:92px 1fr;gap:0;width:100%;}
.vert-lane-label{background:var(--bg2);border-right:1.5px solid var(--border2);border-bottom:0.5px solid var(--border);padding:4px 6px;font-size:9px;font-weight:500;min-height:24px;display:flex;align-items:center;position:sticky;left:0;z-index:2;}
.vert-month-row{display:flex;border-bottom:0.5px solid var(--border);}
.vert-month-cell{flex:1;border-right:0.5px solid var(--border);padding:2px;min-height:24px;display:flex;align-items:center;font-size:8px;color:var(--text3);}
.vert-month-label{background:var(--bg2);border-right:1.5px solid var(--border2);border-bottom:0.5px solid var(--border);padding:3px 6px;font-size:10px;font-weight:500;color:var(--text2);width:92px;flex-shrink:0;min-height:24px;display:flex;align-items:center;}
/* SIDEBAR CARDS */
.scard{background:var(--bg2);border-radius:var(--radius);padding:8px 10px;margin-bottom:6px;}
.sc-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.sav{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:500;}
.savr{width:20px;height:20px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:500;}
.snm{font-size:11px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.sfrac{font-size:10px;}
.bt{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:2px;}
.bf{height:100%;border-radius:2px;}
.blbl{display:flex;justify-content:space-between;font-size:9px;color:var(--text3);}
.tri{display:flex;align-items:flex-start;gap:5px;padding:4px 0;border-bottom:0.5px solid var(--border);cursor:pointer;}
.tri:last-child{border-bottom:none;}
.trd{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.trnm{font-size:10px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trdt{font-size:9px;color:var(--text3);}
.phl-row{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:0.5px solid var(--border);}
.phl-row:last-child{border-bottom:none;}
.phl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
/* DASHBOARD */
.dash{flex:1;overflow-y:auto;padding:14px;}
.dg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px;}
.dc{background:var(--bg2);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;}
.dclbl{font-size:10px;color:var(--text2);margin-bottom:3px;}
.dcval{font-size:22px;font-weight:500;color:var(--text);}
.dcsub{font-size:9px;color:var(--text3);}
.month-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:6px;}
.mt-cell{background:var(--bg3);border-radius:5px;padding:5px 4px;text-align:center;}
.mt-mn{font-size:8px;color:var(--text3);margin-bottom:2px;}
.mt-val{font-size:10px;font-weight:500;color:var(--text);}
.hm-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;}
.hm-cell{text-align:center;}
.hm-bar{height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;margin-bottom:3px;}
/* MODAL */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;z-index:100;}
.mbox{background:var(--bg);border-radius:var(--radius-lg);padding:18px;width:330px;border:0.5px solid var(--border2);max-height:92vh;overflow-y:auto;}
.mbox h3{font-size:14px;font-weight:500;margin-bottom:13px;color:var(--text);}
.fg{margin-bottom:9px;}
.fg label{display:block;font-size:10px;color:var(--text2);margin-bottom:3px;}
.fg input,.fg select,.fg textarea{width:100%;padding:6px 9px;border:0.5px solid var(--border2);border-radius:6px;font-size:12px;background:var(--bg);color:var(--text);font-family:inherit;}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px;}
.mbtns{display:flex;gap:7px;justify-content:flex-end;margin-top:14px;}
.mb{padding:5px 14px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;}
.mbc{background:none;border:0.5px solid var(--border2);color:var(--text2);}
.mbs{background:var(--blue);color:#fff;border:none;font-weight:500;}
.mbd{background:none;border:0.5px solid #E24B4A;color:#A32D2D;}
.pm-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border:0.5px solid var(--border);border-radius:8px;margin-bottom:6px;}
.pm-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:500;}
.pm-avr{width:24px;height:24px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:500;}
.pm-nm{font-size:12px;color:var(--text);flex:1;}
.pm-sub{font-size:10px;color:var(--text3);}
.pm-ed{font-size:11px;color:var(--blue);cursor:pointer;padding:2px 6px;}
.sws{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
.sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;}
.sw.on{border-color:var(--text);}
.rec-opts,.cat-opts{display:flex;gap:4px;flex-wrap:wrap;}
.rec-opt,.cat-opt{padding:4px 9px;font-size:11px;border:0.5px solid var(--border2);border-radius:5px;cursor:pointer;background:none;color:var(--text2);}
.rec-opt.on,.cat-opt.on{background:var(--blue);color:#fff;border-color:var(--blue);}
.dclbl2{font-size:10px;color:var(--text2);margin:3px 0 7px;}
.bill-cat-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:0.5px solid var(--border);}
.bill-cat-row:last-child{border-bottom:none;}
/* MILESTONE TOOLTIP */
.mstip{position:fixed;background:var(--text);color:#fff;padding:8px 10px;border-radius:8px;font-size:11px;z-index:300;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.28);max-width:200px;display:none;}
.mstip-title{font-weight:500;margin-bottom:3px;}
.mstip-sub{color:rgba(255,255,255,.65);font-size:10px;line-height:1.5;}
/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:200;}
.loading-logo{font-size:28px;font-weight:500;letter-spacing:-.5px;color:var(--text);}
.loading-logo em{color:var(--blue);font-style:normal;}
.loading-sub{font-size:13px;color:var(--text3);}
.spinner{width:24px;height:24px;border:2.5px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* ── GANTT ── */
.gantt-phase-bar{position:absolute;border-radius:4px;display:flex;align-items:center;overflow:visible;cursor:grab;user-select:none;box-shadow:0 1px 3px rgba(0,0,0,.22);}
.gantt-phase-bar:active,.gantt-phase-bar.dragging{cursor:grabbing;}
.gantt-rh{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize;z-index:3;}
.gantt-rh-l{left:0;border-radius:4px 0 0 4px;}
.gantt-rh-r{right:0;border-radius:0 4px 4px 0;}
.gantt-drag-tip{position:fixed;background:var(--text);color:#fff;padding:4px 9px;border-radius:6px;font-size:11px;z-index:400;pointer-events:none;display:none;white-space:nowrap;}
/* ── MOBILE / RESPONSIVE ── */
.mob-only{display:none;}
.mob-month-strip{display:none;align-items:center;gap:4px;padding:7px 12px;border-top:0.5px solid var(--border);background:var(--bg);min-height:44px;}
.mob-chev{width:36px;height:36px;border:none;background:none;font-size:22px;color:var(--text2);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;min-width:44px;min-height:44px;}
.mob-chev:active{background:var(--bg2);}
.mob-month-lbl{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.3px;flex:1;}
.mob-today-btn{padding:6px 14px;font-size:12px;font-weight:500;border:0.5px solid var(--border2);border-radius:20px;background:none;color:var(--text2);cursor:pointer;min-height:36px;white-space:nowrap;}
.mob-today-btn:active{background:var(--bg2);}
.mob-panel-btn{width:44px;height:44px;border:none;background:none;font-size:18px;color:var(--text2);cursor:pointer;display:none;align-items:center;justify-content:center;border-radius:8px;flex-shrink:0;}
.mob-panel-btn:active{background:var(--bg2);}
.mob-btabs{position:fixed;bottom:0;left:0;right:0;display:none;background:var(--bg);border-top:0.5px solid var(--border);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);}
.mob-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:56px;border:none;background:none;cursor:pointer;color:var(--text3);padding:4px 0;min-width:44px;font-family:inherit;}
.mob-tab.on{color:var(--blue);}
.mob-tab-lbl{font-size:11px;font-weight:500;}
.mob-tab-bar{width:20px;height:2px;border-radius:1px;background:transparent;margin-bottom:4px;}
.mob-tab.on .mob-tab-bar{background:var(--blue);}
.mob-fab{position:fixed;bottom:68px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:30px;font-weight:300;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:19;box-shadow:0 4px 14px rgba(55,138,221,.45);line-height:1;font-family:inherit;}
.mob-sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:30;}
.mob-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-radius:16px 16px 0 0;max-height:82vh;overflow-y:auto;z-index:31;padding:0 14px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);}
.mob-sheet.open{transform:translateY(0);}
.mob-sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:12px auto 14px;cursor:pointer;}
.mob-agenda{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 80px;}
.mob-day-hdr{font-size:10px;font-weight:600;color:var(--text3);margin:16px 0 6px;text-transform:uppercase;letter-spacing:.5px;}
.mob-day-hdr.today{color:var(--blue);}
.mob-card{display:flex;background:var(--bg);border-radius:10px;margin-bottom:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.07);cursor:pointer;border:0.5px solid var(--border);}
.mob-card:active{opacity:.75;}
.mob-card-bar{width:4px;flex-shrink:0;}
.mob-card-body{padding:10px 12px;flex:1;min-width:0;}
.mob-card-title{font-size:14px;font-weight:600;color:var(--text);}
.mob-card-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.mob-empty{text-align:center;padding:48px 0;color:var(--text3);font-size:13px;}
.mob-sect-hdr{font-size:12px;font-weight:600;color:var(--text);margin:0 0 10px;padding-top:4px;}
.mob-vtog{display:flex;border:0.5px solid var(--border2);border-radius:5px;overflow:hidden;flex-shrink:0;}
.mob-vt{padding:2px 7px;font-size:10px;background:none;border:none;cursor:pointer;color:var(--text2);font-family:inherit;line-height:1.5;}
.mob-vt.on{background:var(--blue);color:#fff;font-weight:500;}
.mob-chev-sm{width:28px;height:28px;font-size:18px;min-width:32px;min-height:32px;}
.mob-month-lbl-sm{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;letter-spacing:-.2px;min-width:60px;text-align:center;}
.mob-today-sm{padding:3px 8px;font-size:10px;min-height:26px;}
@media(max-width:640px){
  .desk-only{display:none!important;}
  .mob-only{display:flex!important;}
  .mob-panel-btn{display:flex!important;}
  .mob-month-strip{display:flex;}
  .mob-btabs{display:flex;}
  .mob-fab{display:flex;}
  .tb1{flex-wrap:nowrap;padding:10px 0;}
  #app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{flex-shrink:0;}
  .body{flex:1!important;height:0!important;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
  .mob-agenda{flex:1;min-height:0;}
}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">annu<em>cal</em></div>
  <div class="spinner"></div>
  <div class="loading-sub" id="loadingMsg">Connecting to cloud...</div>
</div>

<div id="app" style="display:none;">
<div class="topbar">
  <div class="tb1">
    <span class="logo">annu<em>cal</em></span>
    <button class="yn desk-only" id="pY">&#8249;</button>
    <span class="yrlbl desk-only" id="yrL">2026</span>
    <button class="yn desk-only" id="nY">&#8250;</button>
    <button class="ab abp desk-only" id="todayBtn" onclick="jumpToday()">Today</button>
    <div class="vsep desk-only"></div>
    <div class="tog desk-only">
      <button class="tb on" id="bCal" onclick="setView('cal')">Calendar</button>
      <button class="tb" id="bDash" onclick="setView('dash')">Dashboard</button>
    </div>
    <div class="tog desk-only">
      <button class="tb on" id="bH" onclick="setDir('h')">Horizontal</button>
      <button class="tb" id="bV" onclick="setDir('v')">Vertical</button>
    </div>
    <div class="ml desk-only" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <div class="sync-badge"><div class="sync-dot" id="syncDot"></div><span id="syncLbl">Syncing...</span></div>
      <button class="ab" onclick="showPeople()">People</button>
      <button class="ab" onclick="showProjectsMgr()">Projects</button>
      <button class="ab" onclick="showBillsMgr()">Bills</button>
      <button class="ab" id="sbBtn" onclick="sbOpen=!sbOpen;render();">Panel ›</button>
      <button class="ab abp" onclick="openAddEv(TODAY,'')">+ Add event</button>
    </div>
    <!-- Mobile: compact single-row controls -->
    <div class="mob-only" style="margin-left:auto;align-items:center;gap:5px;flex-shrink:0;">
      <div class="mob-vtog">
        <button id="mBCal" class="mob-vt on" onclick="setView('cal')">Cal</button>

/* ── ONTARIO HOLIDAYS ── */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),day=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,day);}
function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtD(d){return d.toISOString().split('T')[0];}
function nthMon(y,m,n){let d=new Date(y,m,1);while(d.getDay()!==1)d.setDate(d.getDate()+1);d.setDate(d.getDate()+(n-1)*7);return d;}
function monBef(d){const r=new Date(d);r.setDate(r.getDate()-1);while(r.getDay()!==1)r.setDate(r.getDate()-1);return r;}
function canDay(y){const d=new Date(y,6,1);return d.getDay()===0?fmtD(new Date(y,6,2)):d.getDay()===6?fmtD(new Date(y,6,3)):fmtD(d);}
function boxDay(y){const d=new Date(y,11,26);return(d.getDay()===0||d.getDay()===6)?fmtD(new Date(y,11,28)):fmtD(d);}
let _ph=null;
function getHolidays(){
  if(_ph&&_ph.y===year)return _ph.list;
  const e=easter(year);
  const list=[
    {name:"New Year's Day",date:fmtD(new Date(year,0,1)),stat:true},
    {name:'Family Day',date:fmtD(nthMon(year,1,3)),stat:true},
    {name:'Good Friday',date:fmtD(addD(e,-2)),stat:true},
    {name:'Easter Monday',date:fmtD(addD(e,1)),stat:false},
    {name:'Victoria Day',date:fmtD(monBef(new Date(year,4,25))),stat:true},
    {name:'Canada Day',date:canDay(year),stat:true},
    {name:'Civic Holiday',date:fmtD(nthMon(year,7,1)),stat:false},
    {name:'Labour Day',date:fmtD(nthMon(year,8,1)),stat:true},
    {name:"Nat'l Day T&R",date:fmtD(new Date(year,8,30)),stat:false},
    {name:'Thanksgiving',date:fmtD(nthMon(year,9,2)),stat:true},
    {name:'Remembrance Day',date:fmtD(new Date(year,10,11)),stat:false},
    {name:'Christmas Day',date:fmtD(new Date(year,11,25)),stat:true},
    {name:'Boxing Day',date:boxDay(year),stat:true},
  ];
  _ph={y:year,list};return list;
}
function phOn(date){return getHolidays().find(h=>h.date===date);}

/* ── EVENTS / BILLS ── */
function expandedEvents(){
  const out=[];
  events.forEach(e=>{
    const r=e.recur||'none';
    if(r==='none'){if((e.start||'').startsWith(String(year)))out.push(e);}
    else if(r==='annual'){const s=e.start.replace(/^\d{4}/,year),en=e.end?e.end.replace(/^\d{4}/,year):s;out.push({...e,start:s,end:en,_orig:e.id});}
    else if(r==='monthly'){for(let m=0;m<12;m++){const mm=String(m+1).padStart(2,'0'),dd=e.start.slice(8),nd=dim(m,year),day=Math.min(parseInt(dd),nd);out.push({...e,start:`${year}-${mm}-${String(day).padStart(2,'0')}`,end:`${year}-${mm}-${String(day).padStart(2,'0')}`,_orig:e.id});}}
  });
  return out;
}
function evOn(pid,date){return expandedEvents().filter(e=>e.pid===pid&&date>=e.start&&date<=e.end);}
function taken(pid){return expandedEvents().filter(e=>e.pid===pid).reduce((a,e)=>a+wkd(e.start,e.end),0);}

function billOccurrences(){
  const occ=[];
  bills.forEach(b=>{
    if(hidden.has('cat_'+b.cat))return;
    const c=bcat(b);
    if(b.recur==='monthly'){for(let m=0;m<12;m++){const nd=dim(m,year);const day=Math.min(b.day||1,nd);occ.push({...b,date:ds(year,m,day),c});}}
    else if(b.recur==='annual'){const mo=(b.annualMonth||1)-1;const nd=dim(mo,year);const day=Math.min(b.day||1,nd);occ.push({...b,date:ds(year,mo,day),c});}
    else if(b.recur==='quarterly'){[0,3,6,9].forEach(mo=>{const nd=dim(mo,year);const day=Math.min(b.day||1,nd);occ.push({...b,date:ds(year,mo,day),c});});}
  });
  return occ;
}
function billsOnDate(date){return billOccurrences().filter(o=>o.date===date);}
function monthlyBillTotal(m){return bills.reduce((tot,b)=>{if(hidden.has('cat_'+b.cat))return tot;if(b.recur==='monthly')return tot+(b.amount||0);if(b.recur==='quarterly'&&[0,3,6,9].includes(m))return tot+(b.amount||0);if(b.recur==='annual'&&(b.annualMonth||1)-1===m)return tot+(b.amount||0);return tot;},0);}
function annualBillTotal(){return bills.reduce((t,b)=>t+(b.recur==='monthly'?b.amount*12:b.recur==='quarterly'?b.amount*4:b.amount),0);}
function projProgress(pr){return Math.min(100,Math.max(0,pr.progress||0));}
function projSpans(pr,date){return pr.start<=date&&pr.end>=date;}
function projMsOn(pr,date){return(pr.milestones||[]).find(m=>m.date===date);}
function projRollupPct(pr){const ph=pr.phases||[];if(!ph.length)return projProgress(pr);let num=0,den=0;ph.forEach(p=>{const d=Math.max(1,Math.round((new Date(p.end+'T00:00:00Z')-new Date(p.start+'T00:00:00Z'))/864e5)+1);num+=d*(p.pct||0);den+=d;});return den?Math.round(num/den):0;}
function addDaysStr(s,n){const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function toggleProjCollapse(id){if(collapsedProjects.has(id))collapsedProjects.delete(id);else collapsedProjects.add(id);render();}

  const phCount=(pr.phases||[]).length;
  return `<div style="display:flex;align-items:center;gap:4px;">${chev}<div style="width:18px;height:18px;border-radius:3px;background:${c.bar};color:#fff;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;flex-shrink:0;">${pr.initials}</div><div style="min-width:0;flex:1;"><div style="font-size:9px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${pr.name} <span style="color:${c.brd};font-weight:600;">${pct}%</span></div><div style="height:3px;background:${c.bar}28;border-radius:2px;overflow:hidden;margin-top:3px;"><div style="height:100%;width:${pct}%;background:${c.bar};border-radius:2px;"></div></div>${hasPh&&!collapsed?`<div style="font-size:7px;color:var(--text3);margin-top:1px;">${phCount} phase${phCount!==1?'s':''}</div>`:''}</div></div>`;
}

function _renderProjCell(td,day,pr,c){

  if(projSpans(pr,day.str)){
    const isSt=pr.start===day.str,isEn=pr.end===day.str;
    const inn=document.createElement('div');inn.className='eb-in';
    if(hasPh){
      inn.style.cssText=`background:${c.bg};border-top:1.5px solid ${c.bar}40;border-bottom:1.5px solid ${c.bar}40;`;
      if(isSt){inn.style.borderLeft=`2px solid ${c.bar}60`;inn.style.borderRadius='4px 0 0 4px';}

      if(isSt&&isEn)inn.style.borderRadius='4px';
      const bar=document.createElement('div');bar.className='eb';bar.appendChild(inn);td.appendChild(bar);
    } else {
      const totalDays=Math.max(1,(new Date(pr.end)-new Date(pr.start))/864e5);
      const dayOff=Math.max(0,(new Date(day.str)-new Date(pr.start))/864e5);
      const inP=(dayOff/totalDays*100)<=pct;
      inn.style.cssText=`background:${inP?c.bar+'55':c.bar+'28'};border-top:1.5px solid ${c.bar}${inP?'99':'55'};border-bottom:1.5px solid ${c.bar}${inP?'99':'55'};`;
      if(isSt){
        inn.style.borderLeft=`3px solid ${c.bar}`;inn.style.borderRadius='3px 0 0 3px';
        const lbl=document.createElement('span');lbl.className='eblbl';lbl.style.color=c.txt;lbl.textContent=pr.name+' '+pct+'%';inn.appendChild(lbl);

        inn.appendChild(rhL);inn.appendChild(rhR);

        inn.onclick=e=>e.stopPropagation();
        barEl.appendChild(inn);td.appendChild(barEl);
      } else {

      }

  }
  if(hasPh&&!collapsed){

      if(phSpan*26>48){const lbl=document.createElement('span');lbl.style.cssText=`position:absolute;left:7px;right:10px;top:50%;transform:translateY(-50%);font-size:9px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;`;lbl.textContent=ph.name;phBar.appendChild(lbl);}
      const rhL=document.createElement('div');rhL.className='gantt-rh gantt-rh-l';rhL.onmousedown=e=>{e.preventDefault();e.stopPropagation();startGanttDrag(e,'phase',ph.id,'resize-l',null,pr.id);};
      const rhR=document.createElement('div');rhR.className='gantt-rh gantt-rh-r';rhR.onmousedown=e=>{e.preventDefault();e.stopPropagation();startGanttDrag(e,'phase',ph.id,'resize-r',null,pr.id);};
      phBar.appendChild(rhL);phBar.appendChild(rhR);

}

function startGanttDrag(e,type,id,mode,onclick,prId){
  let origStart,origEnd,barEl;
  if(type==='phase'){
    const pr=projects.find(p=>p.id===prId);const ph=(pr?.phases||[]).find(p=>p.id===id);if(!ph)return;
    origStart=ph.start;origEnd=ph.end;
    barEl=e.currentTarget.classList.contains('gantt-phase-bar')?e.currentTarget:e.currentTarget.closest('.gantt-phase-bar');
    if(barEl){barEl.classList.add('dragging');barEl.style.transition='none';barEl.style.opacity='.85';}
  } else if(type==='event'){
    const ev=events.find(x=>x.id===id);if(!ev)return;
    origStart=ev.start;origEnd=ev.end;barEl=null;
  } else if(type==='project'){
    const pr=projects.find(p=>p.id===id);if(!pr)return;
    origStart=pr.start;origEnd=pr.end;barEl=null;
  } else return;
  const origW=barEl?barEl.offsetWidth:0;
  _ganttDrag={type,id,mode,startX:e.clientX,origStart,origEnd,barEl,origW,onclick,prId};
  const tip=document.getElementById('ganttDragTip');
  if(tip){tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-36)+'px';tip.textContent=origStart+' → '+origEnd;}
}
function onGanttMouseMove(e){
  if(!_ganttDrag)return;
  const delta=Math.round((e.clientX-_ganttDrag.startX)/26);
  const {barEl,mode,origStart,origEnd,origW,type}=_ganttDrag;
  if(type==='phase'&&barEl){
    if(mode==='move')barEl.style.transform=`translateX(${delta*26}px)`;
    else if(mode==='resize-r')barEl.style.width=Math.max(26,origW+delta*26)+'px';
    else if(mode==='resize-l'){barEl.style.transform=`translateX(${delta*26}px)`;barEl.style.width=Math.max(26,origW-delta*26)+'px';}
  }
  const tip=document.getElementById('ganttDragTip');
  if(tip){
    const ns=mode==='resize-r'?origStart:addDaysStr(origStart,delta);
    const ne=mode==='resize-l'?origEnd:addDaysStr(origEnd,delta);
    tip.textContent=ns+' → '+ne;tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY-36)+'px';
  }
}
function onGanttMouseUp(e){
  if(!_ganttDrag)return;
  const delta=Math.round((e.clientX-_ganttDrag.startX)/26);
  const {type,id,mode,onclick,prId,barEl}=_ganttDrag;
  if(type==='phase'){
    const pr=projects.find(p=>p.id===prId);const ph=(pr?.phases||[]).find(p=>p.id===id);
    if(ph&&delta!==0){
      if(mode==='move'){ph.start=addDaysStr(ph.start,delta);ph.end=addDaysStr(ph.end,delta);}
      else if(mode==='resize-r'){const ne=addDaysStr(ph.end,delta);if(ne>ph.start)ph.end=ne;}
      else if(mode==='resize-l'){const ns=addDaysStr(ph.start,delta);if(ns<ph.end)ph.start=ns;}
      scheduleSave();
    }
    if(barEl){barEl.classList.remove('dragging');barEl.style.transition='';barEl.style.opacity='';}
  } else if(type==='event'){
    const ev=events.find(x=>x.id===id);
    if(ev&&delta!==0){
      if(mode==='move'){ev.start=addDaysStr(ev.start,delta);ev.end=addDaysStr(ev.end,delta);}
      else if(mode==='resize-r'){const ne=addDaysStr(ev.end,delta);if(ne>=ev.start)ev.end=ne;}
      else if(mode==='resize-l'){const ns=addDaysStr(ev.start,delta);if(ns<=ev.end)ev.start=ns;}
      scheduleSave();
    } else if(delta===0&&onclick)onclick();
  } else if(type==='project'){
    const pr=projects.find(p=>p.id===id);
    if(pr&&delta!==0){
      if(mode==='move'){pr.start=addDaysStr(pr.start,delta);pr.end=addDaysStr(pr.end,delta);}
      else if(mode==='resize-r'){const ne=addDaysStr(pr.end,delta);if(ne>pr.start)pr.end=ne;}
      else if(mode==='resize-l'){const ns=addDaysStr(pr.start,delta);if(ns<pr.end)pr.start=ns;}
      scheduleSave();
    } else if(delta===0&&onclick)onclick();
  }
  const tip=document.getElementById('ganttDragTip');if(tip)tip.style.display='none';
  _ganttDrag=null;render();
}
function dayList(){const days=[];for(let m=0;m<12;m++){const nd=dim(m,year);for(let d=1;d<=nd;d++)days.push({y:year,m,d,str:ds(year,m,d),isLast:d===nd});}return days;}

function scrollToToday(){
  setTimeout(()=>{
    const body=document.getElementById('body');
    if(!body)return;
    if(dMode==='v'){
      const wrap=body.querySelector('.vert-wrap');
      if(!wrap)return;
      if(year!==CY){wrap.scrollTop=0;return;}
      const monthEl=document.getElementById(`month-${NOW.getMonth()}`);
      if(monthEl)wrap.scrollTop=Math.max(0,monthEl.offsetTop-50);
    }else{
      const wrap=body.querySelector('.hwrap');
      if(!wrap)return;
      if(year!==CY){wrap.scrollLeft=0;return;}
      const dl=dayList();
      const idx=dl.findIndex(d=>d.str===TODAY);
      if(idx>=0)wrap.scrollLeft=Math.max(0,idx*26-140);
    }
  },50);
}
function restoreScroll(pos){
  if(!pos)return;
  setTimeout(()=>{
    const body=document.getElementById('body');
    const wrap=body&&(body.querySelector('.hwrap')||body.querySelector('.vert-wrap'));
    if(wrap){wrap.scrollLeft=pos.left;wrap.scrollTop=pos.top;}
  },0);
}
function jumpToday(){
  if(year!==CY){year=CY;document.getElementById('yrL').textContent=year;}
  render({goToday:true});
}

/* ── RENDER ── */
function render(opts){
  opts=opts||{};
  _ph=null;

  if(isMobile()){renderMobile(opts);return;}

  buildLB();
  document.getElementById('bCal').className='tb'+(vMode==='cal'?' on':'');
  document.getElementById('bDash').className='tb'+(vMode==='dash'?' on':'');
  document.getElementById('bH').className='tb'+(dMode==='h'?' on':'');
  document.getElementById('bV').className='tb'+(dMode==='v'?' on':'');
  const sbBtn=document.getElementById('sbBtn');
  if(sbBtn)sbBtn.textContent=sbOpen?'Panel ‹':'Panel ›';
  const body=document.getElementById('body');
  const oldWrap=body.querySelector('.hwrap')||body.querySelector('.vert-wrap');
  const oldScroll=oldWrap?{left:oldWrap.scrollLeft,top:oldWrap.scrollTop}:null;
  body.innerHTML='';
  if(vMode==='dash'){body.appendChild(buildDash());if(sbOpen)body.appendChild(buildSB());return;}
  if(dMode==='v'){body.appendChild(buildVert());if(sbOpen)body.appendChild(buildSB());
    if(opts.goToday)scrollToToday();else restoreScroll(oldScroll);
    return;}
  body.appendChild(buildHoriz());if(sbOpen)body.appendChild(buildSB());
  if(opts.goToday)scrollToToday();else restoreScroll(oldScroll);
}
function setView(v){vMode=v;const mbc=document.getElementById('mBCal');const mbd=document.getElementById('mBDash');if(mbc){mbc.classList.toggle('on',v==='cal');mbd.classList.toggle('on',v==='dash');}render({goToday:true});}
function setDir(d){dMode=d;render({goToday:true});}

/* ── EVENT MODAL ── */
let editEvId=null;
function openAddEv(date,pid){editEvId=null;showEvModal({start:date,end:date,pid:pid||people[0]?.id||'',title:'',recur:'none'});}
function openEditEv(id){editEvId=id;const ev=events.find(e=>e.id===id);if(ev)showEvModal(ev);}
function showEvModal(ev){
  const opts=people.map(p=>`<option value="${p.id}"${ev.pid===p.id?' selected':''}>${p.name}</option>`).join('');
  const recs=['none','annual','monthly'].map(r=>`<button class="rec-opt${(ev.recur||'none')===r?' on':''}" onclick="setRec('${r}',this)">${r==='none'?'One-time':r==='annual'?'Yearly':'Monthly'}</button>`).join('');
  document.getElementById('mroot').innerHTML=`<div class="mov" id="mOv"><div class="mbox"><h3>${editEvId?'Edit':'Add'} event</h3>
    <div class="fg"><label>Person</label><select id="mPid">${opts}</select></div>
    <div class="fg"><label>Name</label><input type="text" id="mTit" value="${ev.title||''}" placeholder="Trip or event name"/></div>
    <div class="fg2"><div class="fg" style="margin:0;"><label>Start</label><input type="date" id="mS" value="${ev.start||''}"/></div><div class="fg" style="margin:0;"><label>End</label><input type="date" id="mE" value="${ev.end||ev.start||''}"/></div></div>
    <div class="dclbl2" id="dcL"></div>
    <div class="fg"><label>Repeat</label><div class="rec-opts">${recs}</div></div>
    <input type="hidden" id="mRec" value="${ev.recur||'none'}"/>
    <div class="mbtns">${editEvId?'<button class="mb mbd" onclick="delEv()">Delete</button>':''}
      <button class="mb mbc" onclick="closeMod()">Cancel</button><button class="mb mbs" onclick="saveEv()">Save</button></div>
  </div></div>`;
  document.getElementById('mOv').onclick=e=>{if(e.target.id==='mOv')closeMod();};
  updDC();['mS','mE'].forEach(i=>document.getElementById(i)?.addEventListener('change',updDC));

/* ── MOBILE ── */
function isMobile(){return window.innerWidth<=640;}

function fmtRange(s,e){
  const sd=new Date(s+'T00:00:00');
  if(!e||e===s)return sd.toLocaleDateString('en-CA',{month:'short',day:'numeric'});
  const ed=new Date(e+'T00:00:00');
  return sd.toLocaleDateString('en-CA',{month:'short',day:'numeric'})+' – '+ed.toLocaleDateString('en-CA',{month:'short',day:'numeric'});
}

function buildAgenda(){
  const wrap=document.createElement('div');wrap.className='mob-agenda';
  const m=mobMonth,y=year;
  const nd=dim(m,y);
  const moStr=`${y}-${String(m+1).padStart(2,'0')}`;
  const moStart=moStr+'-01';
  const moEnd=`${moStr}-${String(nd).padStart(2,'0')}`;
  const items=[];

  // Events
  expandedEvents().forEach(ev=>{
    if(hidden.has(ev.pid))return;
    const s=ev.start,e=(ev.end||ev.start);
    if(s>moEnd||e<moStart)return;
    const p=pById(ev.pid);if(!p)return;
    const c=ppal(p);
    const displayDate=s<moStart?moStart:s;
    items.push({type:'event',date:displayDate,title:ev.title+(ev.recur&&ev.recur!=='none'?' ↻':''),
      sub:p.name+' · '+fmtRange(s,e),c,onclick:()=>openEditEv(ev._orig||ev.id)});
  });

  // Ontario holidays
  if(showPH){
    getHolidays().filter(h=>h.date.startsWith(moStr)).forEach(h=>{
      items.push({type:'holiday',date:h.date,title:h.name,sub:'Ontario holiday',c:PH_C,onclick:null});
    });
  }

  // Bills
  billOccurrences().filter(o=>o.date.startsWith(moStr)).forEach(o=>{
    if(hidden.has('cat_'+o.cat))return;
    items.push({type:'bill',date:o.date,title:o.name,
      sub:o.c.label+' · '+fmt$(o.amount),c:o.c,onclick:()=>openEditBill(o.id)});
  });

  // Projects — milestones and phase boundaries this month
  projects.filter(pr=>!hidden.has(pr.id)).forEach(pr=>{
    const c=prpal(pr);
    (pr.milestones||[]).filter(m=>m.date.startsWith(moStr)).forEach(m=>{
      items.push({type:'milestone',date:m.date,title:'◆ '+fmtMsName(m.name),
        sub:pr.name+' milestone',c,onclick:()=>openEditProject(pr.id)});
    });
    (pr.phases||[]).forEach(ph=>{
      if(ph.start.startsWith(moStr))
        items.push({type:'phase',date:ph.start,title:'▶ '+ph.name+' starts',
          sub:pr.name,c,onclick:()=>openEditProject(pr.id)});
      if(ph.end.startsWith(moStr)&&ph.end!==ph.start)
        items.push({type:'phase',date:ph.end,title:'■ '+ph.name+' ends',
          sub:pr.name+' · '+(ph.pct||0)+'% complete',c,onclick:()=>openEditProject(pr.id)});
    });
  });

  items.sort((a,b)=>a.date.localeCompare(b.date));

  if(!items.length){
    wrap.innerHTML='<div class="mob-empty">Nothing scheduled this month</div>';
    return wrap;
  }

  // Group by date
  const byDate={};
  items.forEach(item=>{if(!byDate[item.date])byDate[item.date]=[];byDate[item.date].push(item);});

  Object.entries(byDate).sort(([a],[b])=>a.localeCompare(b)).forEach(([date,dateItems])=>{
    const d=new Date(date+'T00:00:00');
    const isToday=(date===TODAY&&y===CY);
    const dayHdr=document.createElement('div');
    dayHdr.className='mob-day-hdr'+(isToday?' today':'');
    dayHdr.textContent=d.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})+(isToday?' · Today':'');
    wrap.appendChild(dayHdr);

    dateItems.forEach(item=>{
      const card=document.createElement('div');card.className='mob-card';
      if(item.onclick){card.onclick=item.onclick;}else{card.style.cursor='default';}
      const bar=document.createElement('div');bar.className='mob-card-bar';bar.style.background=item.c.bar;
      const body=document.createElement('div');body.className='mob-card-body';
      body.innerHTML=`<div class="mob-card-title">${item.title}</div><div class="mob-card-sub">${item.sub}</div>`;
      card.appendChild(bar);card.appendChild(body);
      wrap.appendChild(card);
    });
  });

  return wrap;
}

function updateMobStrip(){
  const lbl=document.getElementById('mobMonthLbl');
  if(lbl)lbl.textContent=MF[mobMonth]+' '+year;
}

function mobPrev(){
  mobMonth--;
  if(mobMonth<0){mobMonth=11;year--;const yl=document.getElementById('yrL');if(yl)yl.textContent=year;}
  render();
}
function mobNext(){
  mobMonth++;
  if(mobMonth>11){mobMonth=0;year++;const yl=document.getElementById('yrL');if(yl)yl.textContent=year;}
  render();
}
function mobToday(){
  year=CY;mobMonth=NOW.getMonth();
  const yl=document.getElementById('yrL');if(yl)yl.textContent=year;
  render();
}

function renderMobileSheet(){
  const root=document.getElementById('mobSheetRoot');
  if(!root)return;
  if(!sbOpen){root.innerHTML='';return;}
  root.innerHTML='';
  const backdrop=document.createElement('div');backdrop.className='mob-sheet-backdrop';
  backdrop.onclick=()=>{sbOpen=false;render();};
  const sheet=document.createElement('div');sheet.className='mob-sheet';
  const handle=document.createElement('div');handle.className='mob-sheet-handle';
  handle.onclick=()=>{sbOpen=false;render();};
  sheet.appendChild(handle);
  const sbContent=buildSB();
  sbContent.className='';sbContent.style.cssText='padding:0;';
  sheet.appendChild(sbContent);
  // Swipe down to dismiss
  let startY=0,curY=0;
  sheet.addEventListener('touchstart',e=>{if(e.touches.length)startY=e.touches[0].clientY;curY=0;},{passive:true});
  sheet.addEventListener('touchmove',e=>{
    if(!e.touches.length)return;
    const delta=e.touches[0].clientY-startY;
    if(delta>0){curY=delta;sheet.style.transform=`translateY(${delta}px)`;}
  },{passive:true});
  sheet.addEventListener('touchend',()=>{
    if(curY>80){sbOpen=false;render();}
    else{sheet.style.transform='';}
  });
  root.appendChild(backdrop);
  root.appendChild(sheet);
  requestAnimationFrame(()=>requestAnimationFrame(()=>sheet.classList.add('open')));
}

function renderMobile(opts){
  updateMobStrip();
  const body=document.getElementById('body');
  body.innerHTML='';
  body.appendChild(buildAgenda());
  renderMobileSheet();
}

/* ── BOOT ── */
document.getElementById('pY').onclick=()=>{year--;document.getElementById('yrL').textContent=year;render({goToday:true});};
document.getElementById('nY').onclick=()=>{year++;document.getElementById('yrL').textContent=year;render({goToday:true});};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){_tmpMs=null;_tmpPh=null;closeMod();}});
document.addEventListener('mousemove',onGanttMouseMove);
document.addEventListener('mouseup',onGanttMouseUp);
let _resizeTimer=null;
window.addEventListener('resize',()=>{clearTimeout(_resizeTimer);_resizeTimer=setTimeout(()=>render(),120);});

async function boot(){
  document.getElementById('loadingMsg').textContent='Loading your calendar...';
  await loadFromCloud();
  document.getElementById('yrL').textContent=year;
  render({goToday:true});
  document.getElementById('loadingScreen').style.display='none';
  document.getElementById('app').style.display='';
  subscribeToChanges();
}

boot();
</script>
